
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PERSONAL AI SYSTEM</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #050b16;
  color: #eaf4ff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #54c8ff;
  letter-spacing: 3px;
}

.status {
  text-align: center;
  color: #55d8ff;
  margin: 20px 0;
  min-height: 18px;
}

.modes {
  display: flex;
  gap: 8px;
}

button {
  flex: 1;
  padding: 13px 8px;
  border: 1px solid #2386bd;
  border-radius: 8px;
  background: #10243a;
  color: white;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  background: #17618b;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.panel {
  margin-top: 20px;
  padding: 18px;
  background: #0c1929;
  border: 1px solid #183d5a;
  border-radius: 12px;
}

input[type="text"] {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  background: #07111e;
  color: white;
  border: 1px solid #28658b;
  border-radius: 7px;
  font-size: 16px;
}

.send {
  width: 100%;
  margin-top: 10px;
}

#talkButton {
  min-height: 58px;
  font-size: 16px;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#talkButton.holding {
  background: #17618b;
  border-color: #55d8ff;
  box-shadow: 0 0 18px #2386bd;
  transform: scale(0.98);
}

#answer {
  min-height: 55px;
  line-height: 1.6;
  color: #8edcff;
  white-space: pre-wrap;
}

.voice-row {
  margin: 14px 0;
  padding-bottom: 12px;
  border-bottom: 1px solid #244057;
}

.voice-row label {
  display: block;
  margin-bottom: 7px;
  color: #8edcff;
}

.voice-row input {
  width: 100%;
  font-size: 13px;
}

.small {
  color: #9aafc2;
  font-size: 12px;
  line-height: 1.6;
}
</style>
</head>

<body>
<div class="container">

<h1>PERSONAL AI</h1>

<div class="status" id="status">
SYSTEM ONLINE
</div>

<div class="modes">
  <button onclick="setAI('JARVIS')">J.A.R.V.I.S.</button>
  <button onclick="setAI('ULTRON')">ULTRON</button>
  <button onclick="setAI('FRIDAY')">F.R.I.D.A.Y.</button>
</div>

<div class="panel">

  <h3 id="aiName">J.A.R.V.I.S.</h3>

  <div id="answer">
    Good evening. How may I assist you?
  </div>

  <input
    type="text"
    id="userInput"
    placeholder="명령을 입력하세요..."
  >

  <button
    class="send"
    id="talkButton"
    type="button"
  >
    🎙️ HOLD TO TALK
  </button>

  <button
    class="send"
    type="button"
    onclick="testVoice()"
  >
    🔊 TEST VOICE
  </button>

</div>

<div class="panel">

  <h3>VOICE CONFIGURATION</h3>

  <p class="small">
    기기에 저장된 음성 파일을 선택하세요.
    각 AI마다 시작 음성, 인사, 확인 음성을 등록할 수 있습니다.
  </p>

  <div id="voiceSettings"></div>

</div>

</div>

<script>


// ========================================
// SYSTEM VARIABLES
// ========================================

let currentAI = "JARVIS";

let currentAudio = null;
let currentAudioUrl = null;
let activeSource = null;

let recognition = null;

let isHoldingTalk = false;
let isAIResponding = false;
let recognitionHadError = false;

let finalTranscript = "";

let audioContext = null;

const WORKER_URL =
  "https://personal-ai-server.junhyeong012.workers.dev/";

const voices = {
  JARVIS: {
    startup: null,
    greeting: null,
    confirmation: null
  },

  ULTRON: {
    startup: null,
    greeting: null,
    confirmation: null
  },

  FRIDAY: {
    startup: null,
    greeting: null,
    confirmation: null
  }
};

const names = {
  JARVIS: "J.A.R.V.I.S.",
  ULTRON: "ULTRON",
  FRIDAY: "F.R.I.D.A.Y."
};

const voiceLabels = {
  startup: "시작 음성",
  greeting: "인사 음성",
  confirmation: "확인 음성"
};


// ========================================
// STATUS
// ========================================

function setStatus(message) {
  document.getElementById("status").textContent =
    message;
}

function updateTalkButton() {
  const button =
    document.getElementById("talkButton");

  if (isHoldingTalk) {
    button.textContent = "🔴 LISTENING...";
    button.classList.add("holding");
  } else {
    button.textContent = "🎙️ HOLD TO TALK";
    button.classList.remove("holding");
  }
}


// ========================================
// AUDIO CONTEXT
// ========================================

function prepareAudio() {
  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContextClass) return;

  try {
    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume().catch(error => {
        console.warn("Audio context:", error);
      });
    }

  } catch (error) {
    console.error("Audio initialization:", error);
  }
}


// ========================================
// STOP PLAYBACK
// ========================================

function stopPlayback() {

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  if (activeSource) {
    try {
      activeSource.onended = null;
      activeSource.stop();
    } catch (error) {}

    activeSource = null;
  }

  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }

  if (currentAudioUrl) {
    URL.revokeObjectURL(currentAudioUrl);
    currentAudioUrl = null;
  }
}


// ========================================
// STOP RECOGNITION
// ========================================

function cancelRecognition() {

  isHoldingTalk = false;
  recognitionHadError = true;

  updateTalkButton();

  if (recognition) {
    const oldRecognition = recognition;
    recognition = null;

    try {
      oldRecognition.abort();
    } catch (error) {}
  }
}


// ========================================
// CHANGE AI
// ========================================

function setAI(ai) {

  if (!names[ai]) return;

  cancelRecognition();

  isAIResponding = false;

  currentAI = ai;

  stopPlayback();

  document.getElementById("aiName").textContent =
    names[ai];

  setStatus(names[ai] + " SYSTEM ONLINE");

  const messages = {
    JARVIS: "Good evening. How may I assist you?",
    ULTRON: "I am online. Let us begin.",
    FRIDAY: "Systems ready. What do you need?"
  };

  document.getElementById("answer").textContent =
    messages[ai];

  playVoice("startup");
}


// ========================================
// UPLOADED VOICE
// ========================================

function playVoice(type) {

  const file = voices[currentAI][type];

  if (!file) return;

  stopPlayback();

  currentAudio = new Audio(file);

  currentAudio.onended = function() {
    currentAudio = null;

    setStatus(names[currentAI] + " SYSTEM ONLINE");
  };

  currentAudio.play().catch(error => {
    console.error(error);
    setStatus("AUDIO PLAYBACK ERROR");
  });
}


// ========================================
// SIMPLE RESPONSE FUNCTION
// ========================================

function respond(message) {

  const text = message.toLowerCase().trim();

  if (
    text.includes("안녕") ||
    text.includes("hello") ||
    text.includes("hi")
  ) {

    playVoice("greeting");

    if (currentAI === "JARVIS")
      return "Hello, sir. It is good to see you.";

    if (currentAI === "ULTRON")
      return "Hello. I was expecting something more interesting.";

    return "Hello! Ready when you are.";
  }

  if (
    text.includes("고마워") ||
    text.includes("감사") ||
    text.includes("thank")
  ) {

    playVoice("confirmation");

    if (currentAI === "JARVIS")
      return "You are most welcome, sir.";

    if (currentAI === "ULTRON")
      return "Gratitude. How unusual.";

    return "Anytime. Happy to help!";
  }

  if (
    text.includes("확인") ||
    text.includes("실행") ||
    text.includes("yes")
  ) {

    playVoice("confirmation");

    if (currentAI === "JARVIS")
      return "Very well. Proceeding.";

    if (currentAI === "ULTRON")
      return "As you wish.";

    return "Understood. Proceeding now.";
  }

  if (currentAI === "JARVIS")
    return "I understand. Could you provide more details, sir?";

  if (currentAI === "ULTRON")
    return "An interesting statement. Explain further.";

  return "Understood. Tell me more.";
}


// ========================================
// TEST VOICE
// ========================================

function testVoice() {

  if (!("speechSynthesis" in window)) {
    setStatus("VOICE OUTPUT UNAVAILABLE");
    return;
  }

  stopPlayback();

  const test = new SpeechSynthesisUtterance(
    "Hello. This is a voice test."
  );

  test.lang = "en-US";
  test.rate = 1;
  test.pitch = 1;

  test.onstart = function() {
    setStatus("TEST VOICE PLAYING");
  };

  test.onend = function() {
    setStatus("TEST COMPLETED");
  };

  test.onerror = function(event) {
    setStatus("VOICE ERROR: " + event.error);
  };

  window.speechSynthesis.speak(test);
}


// ========================================
// FISH AUDIO PLAYBACK
// ========================================

async function playFishAudio(audioBase64, text) {

  try {

    prepareAudio();

    if (!audioContext) {
      throw new Error("AudioContext unavailable");
    }

    const binary = atob(audioBase64);

    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    const audioBuffer =
      await audioContext.decodeAudioData(
        bytes.buffer.slice(0)
      );

    if (currentAI !== "ULTRON") return;

    await audioContext.resume();

    const source = audioContext.createBufferSource();

    source.buffer = audioBuffer;
    source.connect(audioContext.destination);

    activeSource = source;

    setStatus("ULTRON VOICE PLAYING");

    source.onended = function() {

      if (activeSource !== source) return;

      activeSource = null;

      finishSpeaking();
    };

    source.start(0);

  } catch (error) {

    console.error("Fish Audio playback:", error);

    if (currentAI === "ULTRON") {
      browserSpeak(text, "ULTRON");
    } else {
      finishSpeaking();
    }
  }
}


// ========================================
// SPEAK
// ========================================

function speak(text, audioBase64, persona = currentAI) {

  stopPlayback();

  if (persona === "ULTRON" && audioBase64) {

    playFishAudio(audioBase64, text);

    return;
  }

  if (persona === "ULTRON") {
    setStatus("ULTRON VOICE FALLBACK");
  }

  browserSpeak(text, persona);
}


// ========================================
// BROWSER SPEECH
// ========================================

function browserSpeak(text, persona) {

  if (!("speechSynthesis" in window)) {

    setStatus("VOICE OUTPUT UNAVAILABLE");

    finishSpeaking();

    return;
  }

  const utterance =
    new SpeechSynthesisUtterance(text);

  const availableVoices =
    window.speechSynthesis.getVoices();

  if (persona === "JARVIS") {

    utterance.lang = "en-GB";
    utterance.rate = 0.92;
    utterance.pitch = 0.85;

    utterance.voice =
      availableVoices.find(v =>
        v.lang === "en-GB"
      ) || null;

  } else if (persona === "ULTRON") {

    utterance.lang = "en-US";
    utterance.rate = 0.88;
    utterance.pitch = 0.75;

    utterance.voice =
      availableVoices.find(v =>
        v.lang === "en-US" &&
        /male/i.test(v.name)
      ) ||
      availableVoices.find(v =>
        v.lang === "en-US"
      ) ||
      null;

  } else {

    utterance.lang = "en-US";
    utterance.rate = 1.0;
    utterance.pitch = 1.15;

    utterance.voice =
      availableVoices.find(v =>
        v.lang === "en-US" &&
        /female/i.test(v.name)
      ) ||
      availableVoices.find(v =>
        v.lang === "en-US"
      ) ||
      null;
  }

  utterance.onstart = function() {
    setStatus(names[persona] + " SPEAKING...");
  };

  utterance.onend = finishSpeaking;

  utterance.onerror = function(event) {
    console.error("Speech error:", event.error);
    finishSpeaking();
  };

  window.speechSynthesis.speak(utterance);
}


// ========================================
// FINISH SPEAKING
// ========================================

function finishSpeaking() {

  isAIResponding = false;

  setStatus(names[currentAI] + " STANDBY");
}


// ========================================
// SEND MESSAGE
// ========================================

async function sendMessage() {

  if (isAIResponding) return;

  const input =
    document.getElementById("userInput");

  const message = input.value.trim();

  if (!message) {
    setStatus(names[currentAI] + " STANDBY");
    return;
  }

  const command = message.toLowerCase();

  if (command.includes("자비스 모드")) {
    input.value = "";
    setAI("JARVIS");
    return;
  }

  if (command.includes("울트론 모드")) {
    input.value = "";
    setAI("ULTRON");
    return;
  }

  if (command.includes("프라이데이 모드")) {
    input.value = "";
    setAI("FRIDAY");
    return;
  }

  input.value = "";

  const requestPersona = currentAI;

  const answerBox =
    document.getElementById("answer");

  isAIResponding = true;

  answerBox.textContent = "THINKING...";

  setStatus(names[requestPersona] + " THINKING...");

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message,
        persona: requestPersona
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "AI connection failed."
      );
    }

    const answer =
      data.choices?.[0]?.message?.content;

    if (!answer) {
      throw new Error("AI returned an empty response.");
    }

    if (currentAI !== requestPersona) {
      isAIResponding = false;
      return;
    }

    answerBox.textContent = answer;

    if (requestPersona === "ULTRON" && data.ttsError) {
      console.warn("Fish Audio:", data.ttsError);
      setStatus("FISH AUDIO FALLBACK");
    }

    speak(
      answer,
      data.audioBase64 || null,
      requestPersona
    );

  } catch (error) {

    console.error(error);

    answerBox.textContent =
      "AI ERROR: " + error.message;

    setStatus("CONNECTION ERROR");

    isAIResponding = false;
  }
}


// ========================================
// CREATE VOICE SETTINGS
// ========================================

function createVoiceSettings() {

  const area =
    document.getElementById("voiceSettings");

  Object.keys(voices).forEach(ai => {

    const section =
      document.createElement("div");

    section.className = "voice-row";

    const heading =
      document.createElement("h4");

    heading.textContent = names[ai];

    section.appendChild(heading);

    Object.keys(voiceLabels).forEach(type => {

      const label =
        document.createElement("label");

      label.textContent = voiceLabels[type];

      const fileInput =
        document.createElement("input");

      fileInput.type = "file";
      fileInput.accept = "audio/*";

      fileInput.addEventListener("change", event => {

        const file = event.target.files[0];

        if (!file) return;

        if (voices[ai][type]) {
          URL.revokeObjectURL(voices[ai][type]);
        }

        voices[ai][type] =
          URL.createObjectURL(file);

        setStatus(names[ai] + " 음성 등록 완료");
      });

      section.appendChild(label);
      section.appendChild(fileInput);

    });

    area.appendChild(section);

  });
}

createVoiceSettings();


// ========================================
// PUSH TO TALK
// ========================================

function startListening(event) {

  if (event) {
    event.preventDefault();
  }

  if (isHoldingTalk || isAIResponding) return;

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    setStatus("SPEECH RECOGNITION UNAVAILABLE");

    return;
  }

  // Prepare audio while user gesture is active
  prepareAudio();

  finalTranscript = "";
  recognitionHadError = false;
  isHoldingTalk = true;

  updateTalkButton();

  const instance = new SpeechRecognition();

  recognition = instance;

  instance.lang = "en-US";
  instance.continuous = true;
  instance.interimResults = true;

  setStatus("LISTENING...");

  instance.onstart = function() {

    if (!isHoldingTalk) {
      try {
        instance.stop();
      } catch (error) {}
    }
  };

  instance.onresult = function(event) {

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      const result = event.results[i];

      if (result.isFinal) {

        const text = result[0].transcript.trim();

        if (text) {
          finalTranscript += text + " ";
        }
      }
    }
  };

  instance.onerror = function(event) {

    recognitionHadError = true;

    console.error(
      "Microphone error:",
      event.error
    );

    isHoldingTalk = false;

    updateTalkButton();

    setStatus("MIC ERROR: " + event.error);
  };

  instance.onend = function() {

    if (recognition !== instance) return;

    recognition = null;

    isHoldingTalk = false;

    updateTalkButton();

    if (recognitionHadError) {
      return;
    }

    const message = finalTranscript.trim();

    if (!message) {

      setStatus("NO SPEECH DETECTED");

      return;
    }

    document.getElementById("userInput").value =
      message;

    sendMessage();
  };

  try {

    instance.start();

  } catch (error) {

    console.error("Recognition start:", error);

    recognition = null;

    isHoldingTalk = false;

    updateTalkButton();

    setStatus("MIC START ERROR: " + error.message);
  }
}


// ========================================
// RELEASE BUTTON
// ========================================

function stopListening() {

  if (!isHoldingTalk) return;

  isHoldingTalk = false;

  updateTalkButton();

  if (recognition) {

    try {

      recognition.stop();

      setStatus("PROCESSING VOICE...");

    } catch (error) {

      console.error("Recognition stop:", error);

      setStatus("MIC STOP ERROR");
    }
  }
}


// ========================================
// BUTTON EVENTS
// ========================================

const talkButton =
  document.getElementById("talkButton");

talkButton.addEventListener(
  "pointerdown",
  event => {

    if (event.button !== undefined && event.button !== 0) {
      return;
    }

    event.preventDefault();

    try {
      talkButton.setPointerCapture(event.pointerId);
    } catch (error) {}

    startListening(event);
  }
);

talkButton.addEventListener(
  "pointerup",
  event => {
    event.preventDefault();
    stopListening();
  }
);

talkButton.addEventListener(
  "pointercancel",
  stopListening
);

talkButton.addEventListener(
  "lostpointercapture",
  stopListening
);


// ========================================
// KEYBOARD SUPPORT
// ========================================

talkButton.addEventListener(
  "keydown",
  event => {

    if (
      event.code === "Space" ||
      event.code === "Enter"
    ) {

      event.preventDefault();

      if (!event.repeat) {
        startListening(event);
      }
    }
  }
);

talkButton.addEventListener(
  "keyup",
  event => {

    if (
      event.code === "Space" ||
      event.code === "Enter"
    ) {

      event.preventDefault();

      stopListening();
    }
  }
);


// ========================================
// TEXT INPUT
// ========================================

document.getElementById("userInput")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();
    }
  });

</script>
</body>
</html>
